<style>
:root{--bg:#f3f7fd;--card:#fff;--ink:#0f1b3d;--mut:#5b6784;--line:#e3e9f4;--blue:#1f63e8;--org:#f58220;--ok:#12805c;--warn:#b86e00;--bad:#c62f3a;--sky:#dcecfb;--mint:#dff5ea;--peach:#fdebd8;--lilac:#eee3fb;--onblue:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root:not([data-theme=light]){}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--card:#172038;--ink:#eef2fb;--mut:#a3aec8;--line:#27324f;--sky:#18304f;--mint:#16372e;--peach:#3b2a18;--lilac:#2b2347;--ok:#4cd3a0;--warn:#f0b04a;--bad:#ff7b84;--blue:#6b9dff;--onblue:#0b1226}}
:root[data-theme=dark]{--bg:#0e1424;--card:#172038;--ink:#eef2fb;--mut:#a3aec8;--line:#27324f;--sky:#18304f;--mint:#16372e;--peach:#3b2a18;--lilac:#2b2347;--ok:#4cd3a0;--warn:#f0b04a;--bad:#ff7b84;--blue:#6b9dff;--onblue:#0b1226}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
main{flex:1;overflow-y:auto;padding:14px 16px 24px}
h1,h2,h3,p{margin:0}
.logo{font-weight:800;font-size:22px}.logo b{color:var(--org)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h2{font-size:20px}.sub{color:var(--mut);font-size:13px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px;border:1px solid var(--line)}
.cover{flex:none;width:44px;height:58px;border-radius:6px;color:#fff;font-size:8px;font-weight:700;display:flex;align-items:flex-end;padding:4px;line-height:1.1}
.grow{flex:1;min-width:0}.grow b{display:block}
.st{font-size:12px;font-weight:700;text-align:right}.st small{display:block;color:var(--mut);font-weight:400}
.ok{color:var(--ok)}.low{color:var(--warn)}.out{color:var(--bad)}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--blue);color:var(--onblue);font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--blue);border:1px solid var(--blue);width:auto;padding:8px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 4px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:13px}
.total{background:var(--sky);border-radius:14px;padding:12px 14px;margin:12px 0}
.total div{display:flex;justify-content:space-between}.total .big{font-size:20px;font-weight:800;margin-top:4px}
nav{display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
nav button{border:0;background:none;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;padding:6px 12px}
nav button.on{color:var(--blue);font-weight:700}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:10px}
.pill.paid{background:var(--mint);color:var(--ok)}.pill.pend{background:var(--peach);color:var(--warn)}.pill.can{background:var(--line);color:var(--bad)}
.modal{position:absolute;inset:0;background:rgba(10,16,34,.55);display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.rc div{display:flex;justify-content:space-between;padding:4px 0}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.row{flex-wrap:wrap}img.cover{object-fit:cover}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:4px 0}td{padding:6px 0;border-bottom:1px solid var(--line)}th:not(:first-child),td:not(:first-child){text-align:right}td small{color:var(--mut)}
@page{margin:8mm}
@media print{:root,:root[data-theme=dark],:root:not([data-theme=light]){--onblue:#fff;--ok:#12805c;--warn:#b86e00;--bad:#c62f3a;--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#bbb;--blue:#000;--org:#000}html,body{height:auto;overflow:visible;display:block;background:#fff}#app{height:auto;max-width:none;overflow:visible}#main,nav,#toast,.noprint{display:none!important}.modal{position:static;display:block;background:none}.sheet{max-height:none;overflow:visible;border-radius:0;padding:0;width:80mm;margin:0 auto}}
.fb{position:relative;overflow:hidden}.ov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
.logo{color:var(--blue)}.logo b{color:var(--ink)}.logo.xl{font-size:46px}
.ic{width:36px;height:36px;flex:none;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.gr{display:flex;justify-content:space-between;gap:10px;margin:4px 0 14px}.dt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;text-align:center;height:fit-content}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sq{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px;padding:12px 2px;border:0;border-radius:16px;color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}.sq i{font-style:normal;font-size:24px}
.hd{display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px}.hd h3{margin:0}.lnk{border:0;background:none;color:var(--blue);font:inherit;font-size:13px;cursor:pointer}.big2{display:block;font-size:20px}
.av{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.chead{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:14px;min-height:52px;cursor:pointer;text-align:left}.cbar{position:sticky;bottom:8px;display:flex;align-items:center;gap:10px;background:var(--blue);color:var(--onblue);border-radius:16px;padding:10px 12px;margin-top:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}.bk .cover{width:56px;height:72px}.pr{font-size:18px;font-weight:800;margin:2px 0}.col{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;align-self:stretch;gap:8px}
.addb{border:0;background:var(--sky);color:var(--blue);font:inherit;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer}.addb:disabled{opacity:.4}
.dash{width:100%;border:1px dashed var(--blue);background:var(--sky);color:var(--blue);border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer;margin-top:6px}
.mi{display:block;width:100%;text-align:left;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer}
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 8px}.feat{display:flex;gap:16px;margin-bottom:32px;width:100%}.feat div{flex:1;font-size:13px}.feat i{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 6px;border-radius:50%;background:var(--sky);font-style:normal;font-size:22px}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}nav button i{font-style:normal;font-size:19px}nav i.bd2{position:absolute;top:0;right:6px;background:var(--org);color:#fff;font-size:10px;min-width:16px;line-height:16px;border-radius:8px}

main{overflow-x:hidden}input,select{font-size:16px}.btn{min-height:48px}.chip{min-height:38px}.qty button{width:38px;height:38px}.mi{min-height:52px;font-size:16px}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}.kp span{display:block;font-size:12px;color:var(--mut)}.kp b{font-size:18px;overflow-wrap:anywhere}
.al{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:14px;margin-bottom:8px;color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.pill.part{background:var(--sky);color:var(--blue)}hr.d{border:0;border-top:1px dashed var(--mut);margin:10px 0}

function migrate(d){d.books=(d.books||[]).filter(Boolean);d.books.forEach((b,i)=>{if(b.id==null)b.id=i;b.price=+b.price||0;b.stock=Math.max(0,+b.stock||0);if(b.min==null)b.min=10;if(!b.code)b.code='B'+String(+b.id+1).padStart(3,'0');b.sub=b.sub||'General'});

<div class="rc"><div><span>Bill No:</span><b>#${b.no}</b></div><div><span>Date and Time:</span><span>${esc(b.date)}</span></div><div><span>Student:</span><b>${esc(b.name)}</b></div>${s.showCls?`<div><span>Class / Section:</span><span>${cl(b.cls)} / ${esc(b.sec)}</span></div>`:''}${rl?`<div><span>Roll No:</span><span>${esc(rl)}</span></div>`:''}</div><hr class="d">
<table><tr><th>Book</th><th>Qty</th><th>Amount</th></tr>${b.items.map(x=>`<tr><td>${esc(x.name)}<br><small>${cl(x.cls)} • ${R}${x.price}</small></td><td>${x.q}</td><td>${R}${m2(x.price*x.q)}</td></tr>`).join('')||'<tr><td colspan="3" class="sub">Item details not recorded</td></tr>'}</table><hr class="d">
<div class="rc"><div><span>Subtotal:</span><span>${R}${b.sub}</span></div><div><span>Discount:</span><span>${R}${b.disc}</span></div><div style="font-size:17px"><b>Grand Total:</b><b>${R}${b.total}</b></div></div>
${s.showPay?`<hr class="d"><div class="rc"><div><span>Payment:</span><span>${b.pay} (${b.status})</span></div><div><span>Paid:</span><span>${R}${b.pd}</span></div><div><span>Pending:</span><span>${R}${r}</span></div></div>`:''}<hr class="d"><p style="text-align:center;font-size:13px">${esc(s.foot)}</p></div>
<div class="noprint" style="margin-top:14px">${w?`<p class="low" style="margin-bottom:10px">⚠ Low stock: ${esc(w)}</p>`:''}<button class="btn" onclick="doPrint()">🖨 Print Receipt</button><div class="acts" style="margin-top:8px"><button class="btn ghost" onclick="share(${no})">📱 Share</button><button class="btn ghost" onclick="closeM();go('bill')">➕ New Bill</button></div>${b.cancelled?'':`<div class="acts" style="margin-top:8px">${r>0?`<button class="btn ghost" onclick="payForm(${no})">💰 Receive payment</button>`:''}<button class="btn ghost" style="color:var(--bad);border-color:var(--bad)" onclick="cancelBill(${no})">Cancel bill</button></div>`}<button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeM()">Close</button></div>`)}
function doPrint(){try{window.print()}catch(e){toast('Printing is blocked here. Use Share instead.')}}
function rtext(b){const s=D.set,rl=rollOf(b);return [s.store+' - School Books',s.showSchool?s.school:'','Bill #'+b.no+' | '+b.date,'Student: '+b.name+(s.showCls?' ('+cl(b.cls)+'-'+b.sec+')':'')+(rl?' | Roll '+rl:''),'',...b.items.map(x=>x.name+' x'+x.q+' = '+R+m2(x.price*x.q)),'','Subtotal: '+R+b.sub,'Discount: '+R+b.disc,'Grand Total: '+R+b.total,s.showPay?'Payment: '+b.pay+' ('+b.status+') | Paid '+R+b.pd+' | Pending '+R+rem(b):'','',s.foot].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n')}
function share(no){const t=rtext(D.bills.find(x=>x.no==no));if(navigator.share){navigator.share({text:t}).catch(()=>{})}else{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=0;try{ok=document.execCommand('copy')}catch(e){}a.remove();if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{});toast('Bill text copied')}}
function payForm(no){const b=D.bills.find(x=>x.no==no);modal(`<h2>Receive payment</h2><p class="sub" style="margin:4px 0 8px">Bill #${no} • Remaining ${R}${rem(b)}</p><label for="pm">Amount received</label><input id="pm" type="number" min="1" inputmode="decimal" value="${rem(b)}"><button class="btn" style="margin-top:14px" onclick="doPay(${no})">Save payment</button>`)}
function doPay(no){const b=D.bills.find(x=>x.no==no),a=+$('#pm').value;if(!(a>0)||a>rem(b)){toast('Enter an amount up to '+R+rem(b));return}b.pd=m2(b.pd+a);b.status=b.pd>=b.total?'Paid':'Partial';save();render(true);receipt(no);toast('Payment saved')}
function restoreStock(b){if(b.stk&&!b.cancelled)b.items.forEach(x=>{const k=B(x.id);if(k)k.stock+=x.q})}
function cancelBill(no){askPin('Cancel bill #'+no+'?','Books on this bill go back into stock and the bill is left out of reports.',()=>{const b=D.bills.find(x=>x.no==no);restoreStock(b);b.cancelled=true;save();render(true);receipt(no);toast('Bill cancelled')},'Cancel bill')}
function delBill(no){askPin('Delete bill #'+no+'?','The bill is removed for good and its number is not reused. Stock is restored when it was deducted by this bill.',()=>{const b=D.bills.find(x=>x.no==no);restoreStock(b);D.bills=D.bills.filter(x=>x.no!=no);save();render(true);toast('Bill deleted')},'Delete')}

function backupV(){let snap=0;try{snap=!!localStorage.getItem(KEY+'_before_restore')}catch(e){}
return hdr('Backup and Restore','more')+`<div class="card"><h3>Export Backup</h3><p class="sub" style="margin-bottom:10px">Downloads all books, stock, students, bills and settings as one JSON file. Keep it safe, for example in WhatsApp or Google Drive.</p><p class="sub" style="margin-bottom:10px">Last backup: ${D.set.lastBackup?esc(D.set.lastBackup):'never'}</p><button class="btn" onclick="expBackup()">⬇ Export Backup</button></div><div class="card"><h3>Restore Backup</h3><p class="sub" style="margin-bottom:10px">Replaces everything on this device with the backup file. You will see a warning first and need the Admin PIN.</p><div class="fb btn" style="text-align:center">⬆ Choose backup file<input class="ov" type="file" accept=".json,application/json" onchange="pickRestore(this)"></div>${snap?`<button class="btn ghost" style="width:100%;margin-top:10px" onclick="askPin('Undo last restore?','Brings back the data you had before the last restore.',undoRestore,'Undo restore')">↩ Undo last restore</button>`:''}</div><p class="sub">Counts now: ${D.books.length} books, ${D.students.length} students, ${D.bills.length} bills.</p>`}
function expBackup(){try{const o={app:'prbook',...D,exported:new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})};dl('PRbook-backup-'+ld(Date.now())+'.json',JSON.stringify(o,null,1),'application/json');D.set.lastBackup=o.exported;save();render(true);toast('Backup downloaded')}catch(e){toast('Could not export backup')}}
function pickRestore(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onerror=()=>toast('Could not read the file');r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast('This is not a valid backup file');return}
if(!d||d.app!='prbook'||!Array.isArray(d.books)||!Array.isArray(d.bills)||!Array.isArray(d.students)){toast('This is not a P.R.Book backup');return}
S.rest=d;askPin('Restore backup?',`Warning: this replaces ALL data on this device (${D.books.length} books, ${D.students.length} students, ${D.bills.length} bills) with the backup (${d.books.length} books, ${d.students.length} students, ${d.bills.length} bills, saved ${esc(d.exported||'unknown date')}). A safety copy of the current data is kept.`,doRestore,'Restore')};r.readAsText(f)}
function doRestore(){try{localStorage.setItem(KEY+'_before_restore',JSON.stringify(D))}catch(e){toast('Could not make a safety copy. Restore cancelled.');return}D=migrate(S.rest);S.rest=null;S.bl=newBill();save();go('home');toast('Backup restored')}
function undoRestore(){try{D=migrate(JSON.parse(localStorage.getItem(KEY+'_before_restore')));save();go('home');toast('Previous data restored')}catch(e){toast('Nothing to undo')}}
function settingsV(){const s=D.set,T=(k,l)=>`<label style="display:flex;gap:10px;align-items:center;margin:10px 0;color:var(--ink);font-size:14px"><input type="checkbox" style="width:22px;height:22px;flex:none" ${s[k]?'checked':''} onchange="D.set.${k}=this.checked?1:0;save()"> ${l}</label>`,I=(id,l,v)=>`<label for="${id}">${l}</label><input id="${id}" value="${esc(v)}">`;
return hdr('Settings','more')+`<div class="card"><h3>Store Information</h3>${I('s0','Store name',s.store)}${I('s1','School name',s.school)}${I('s2','Address',s.addr)}${I('s3','Phone',s.phone)}<button class="btn" style="margin-top:12px" onclick="saveSet()">Save</button></div><div class="card"><h3>Receipt</h3>${T('showSchool','Show school name')}${T('showCls','Show student class')}${T('showPay','Show payment status')}${I('s4','Footer text',s.foot)}<button class="btn" style="margin-top:12px" onclick="saveSet()">Save</button></div>
<div class="card"><h3>Data</h3><div class="acts"><button class="btn ghost" onclick="expBackup()">Export Backup</button><button class="btn ghost" onclick="go('backup')">Restore</button></div><div class="acts" style="margin-top:8px"><button class="btn ghost" onclick="expCSV('bills')">Bills CSV</button><button class="btn ghost" onclick="expCSV('students')">Students CSV</button><button class="btn ghost" onclick="expCSV('books')">Stock CSV</button></div></div>
<div class="card"><h3>Security</h3>${s.pin==hash('1234')?'<p class="low" style="margin-bottom:10px">Please change the Admin PIN from the starting one.</p>':''}<button class="btn ghost" style="width:100%" onclick="pinForm()">Change Admin PIN</button></div>

function saveSet(){const s=D.set;s.store=$('#s0').value.trim()||'P.R.Book';s.school=$('#s1').value.trim();s.addr=$('#s2').value.trim();s.phone=$('#s3').value.trim();s.foot=$('#s4').value.trim();save();toast('Settings saved')}
function danger(k){const T={bills:['Clear all bills?',`All ${D.bills.length} bills will be deleted. Stock is not changed. New bills continue from #${D.nextNo}.`,()=>{D.bills=[]}],students:['Clear all students?',`All ${D.students.length} students will be deleted. Bills keep the student names.`,()=>{D.students=[];S.bl.sid=''}],stock:['Reset inventory?','The stock of every book is set to 0. Books stay in the list.',()=>{D.books.forEach(b=>b.stock=0);S.bl.items={}}]}[k];

function parseCSV(t,d){const rows=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==d){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}if(c!==''||r.length){r.push(c);rows.push(r)}return rows}

function normCls(v){let t=String(v??'').trim().toLowerCase().replace(/^(class|std|standard|grade)\.?\s*/,'').replace(/^(\d+)(st|nd|rd|th)$/,'$1').trim();const RM={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10};if(RM[t])return RM[t];if(/^\d+(\.0+)?$/.test(t)){const n=Math.round(+t);return CLASSES.includes(n)?n:null}return CLASSES.find(c=>String(c).toLowerCase()==t)||null}
function toStudents(rows){const norm=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]/g,''),H={name:['studentname','name','nameofstudent','student'],cls:['class','std','standard','grade','classname'],sec:['section','sec','div','division'],roll:['rollno','rollnumber','roll','rno'],stid:['studentid','id','admissionno','admissionnumber','admno','scholarno']};
rows=rows.filter(r=>r.some(c=>String(c).trim()));let ix={name:0,cls:1,sec:2,roll:3,stid:4};const h=rows[0]?rows[0].map(norm):[],hi={};for(const k in H)hi[k]=h.findIndex(c=>H[k].includes(c));if(hi.name>=0&&hi.cls>=0){ix=hi;rows=rows.slice(1)}
const g=(r,k)=>ix[k]>=0?String(r[ix[k]]??'').trim():'',out=[],skip=[],seen=new Set();
rows.forEach((r,i)=>{const name=g(r,'name').replace(/\s+/g,' '),rc=g(r,'cls'),c=normCls(rc);if(!name){skip.push('Row '+(i+2)+': missing name');return}if(c==null){skip.push('Row '+(i+2)+': unknown class "'+rc+'"');return}
const o={name,cls:c,sec:(g(r,'sec')||'-').toUpperCase(),roll:g(r,'roll').replace(/\.0+$/,''),stid:g(r,'stid').replace(/\.0+$/,'')},k=o.stid?'i'+o.stid.toLowerCase():[o.name.toLowerCase(),o.cls,o.sec,o.roll].join('|');if(seen.has(k)){skip.push('Row '+(i+2)+': duplicate of an earlier row');return}seen.add(k);out.push(o)});return{rows:out,skip}}
const matchStu=(x,r)=>r.stid&&x.stid?String(x.stid).toLowerCase()==r.stid.toLowerCase():x.name.trim().toLowerCase()==r.name.toLowerCase()&&x.cls==r.cls&&String(x.sec).toLowerCase()==r.sec.toLowerCase()&&(!r.roll||!x.roll||String(x.roll)==r.roll);
async function xlsxRows(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!=0x06054b50)e--;if(e<0)throw 0;const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
for(let i=0;i<n;i++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cm=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);files[new TextDecoder().decode(u.subarray(p+46,p+46+nl))]={m,cs,lo};p+=46+nl+xl+cm}
const get=async nm=>{const f=files[nm];if(!f)return null;const s=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true),d=u.subarray(s,s+f.cs);if(f.m==0)return new TextDecoder().decode(d);const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(d);w.close();return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())},X=t=>new DOMParser().parseFromString(t,'text/xml');
const ss=await get('xl/sharedStrings.xml'),S2=[...X(ss||'<a/>').getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join('')),sn=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0],ws=X(await get(sn)),rows=[];
for(const c of ws.getElementsByTagName('c')){const m=/^([A-Z]+)(\d+)$/.exec(c.getAttribute('r')||'');if(!m)continue;let k=0;for(const ch of m[1])k=k*26+ch.charCodeAt(0)-64;const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];(rows[+m[2]-1]=rows[+m[2]-1]||[])[k-1]=t=='s'&&v?S2[+v.textContent]:t=='inlineStr'?[...c.getElementsByTagName('t')].map(x=>x.textContent).join(''):v?v.textContent:''}

const loadXlsx=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
function importFile(inp){const f=inp.files[0];inp.value='';if(!f)return;const ext=f.name.split('.').pop().toLowerCase(),r=new FileReader();
const done=rows=>{const res=toStudents(rows);if(!res.rows.length){toast(res.skip[0]||'No students found in this file');return}S.imp={...res,file:f.name};S.impMode='add';showImp()};

function doImport(){if(S.impMode=='replace')askPin('Replace student list?',`The ${D.students.length} students in the list now will be replaced by the ${S.imp.rows.length} in the file. Students found in both keep their billing history.`,runImport,'Replace list');else runImport()}
function runImport(){const used=new Set(),nw=[],all=[];let up=0;S.imp.rows.forEach(r=>{const x=D.students.find(s=>!used.has(s.id)&&matchStu(s,r));if(x){used.add(x.id);Object.assign(x,{name:r.name,cls:r.cls,sec:r.sec,roll:r.roll||x.roll,stid:r.stid||x.stid});all.push(x);up++}else{const n={id:newSid(),...r,phone:'',ts:Date.now()};nw.push(n);all.push(n)}});
